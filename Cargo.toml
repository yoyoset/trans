[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]
# M0 验证代码是独立的一次性项目，不属于产品 workspace。
exclude = ["spikes/capture-ocr"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
trans-domain = { path = "crates/trans-domain" }
trans-application = { path = "crates/trans-application" }
trans-providers = { path = "crates/trans-providers" }
trans-presets = { path = "crates/trans-presets" }
trans-win = { path = "crates/trans-win" }

async-trait = "0.1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
windows = "0.62"
windows-capture = "2.0.1"
windows-collections = "0.3"
windows-future = "0.3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
