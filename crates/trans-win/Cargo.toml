[package]
name = "trans-win"
description = "Windows 适配器：Windows.Graphics.Capture 截图、Windows.Media.Ocr 文字识别、凭据管理器。"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
trans-application = { workspace = true }
trans-domain = { workspace = true }
tracing = { workspace = true }
windows-capture = { workspace = true }
windows-collections = { workspace = true }
windows-future = { workspace = true }
windows = { workspace = true, features = [
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
